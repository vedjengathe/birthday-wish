<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Something For You - Happy Birthday</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display & Great Vibes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffe5ec 100%);
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        .font-serif-custom {
            font-family: 'Playfair Display', serif;
        }
        .font-script {
            font-family: 'Great Vibes', cursive;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.4)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(244, 63, 94, 0.7)); }
        }
        .pulsing-heart {
            animation: pulseGlow 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen relative flex items-center justify-center">

    <canvas id="gameCanvas" class="absolute inset-0 w-full h-full cursor-crosshair z-10"></canvas>

    <div id="uiOverlay" class="absolute inset-0 pointer-events-none flex flex-col justify-between items-center p-8 z-20 transition-opacity duration-1000">
        <!-- Top message -->
        <div class="mt-8 text-center opacity-90 transition-all duration-700" id="topTextContainer">
            <h2 class="font-serif-custom italic text-rose-800 text-xl md:text-2xl tracking-wide">A little something, for you</h2>
        </div>

        <!-- Bottom instruction -->
        <div class="mb-10 text-center" id="instructionContainer">
            <p class="font-serif-custom tracking-[0.3em] uppercase text-xs md:text-sm text-rose-700/80 font-semibold animate-pulse">
                PULL &amp; RELEASE
            </p>
        </div>
    </div>

    <div id="birthdayScene" class="absolute inset-0 bg-rose-700 flex flex-col items-center justify-center opacity-0 pointer-events-none z-30 transition-opacity duration-1000 overflow-hidden">
        
        <!-- Wish banner step 1 -->
        <div id="wishStep" class="absolute inset-0 flex items-center justify-center transition-opacity duration-700">
            <h1 class="font-serif-custom italic text-white text-3xl md:text-5xl font-light tracking-wider animate-pulse">
                make a wish...
            </h1>
        </div>

        <!-- Final greeting step 2 -->
        <div id="finalGreetingStep" class="absolute inset-0 flex flex-col items-center justify-center opacity-0 transition-opacity duration-1000 px-4 text-center">
            <div id="treeContainer" class="w-72 h-72 md:w-96 md:h-96 relative mb-4">
                <!-- Blooming tree canvas or SVG -->
                <canvas id="treeCanvas" class="w-full h-full"></canvas>
            </div>
            <p class="font-script text-rose-200 text-xl md:text-2xl mb-1"></p>
            <h1 class="font-serif-custom text-white text-4xl md:text-7xl font-bold tracking-tight mb-2 drop-shadow-md">
                Happy Birthday Riddhii❤️💐🎂
            </h1>
            <p class="font-serif-custom italic text-rose-100/90 text-sm md:text-lg tracking-wide">
                
            </p>
            <button onclick="resetExperience()" class="mt-8 px-6 py-2.5 bg-white/20 hover:bg-white/30 text-white rounded-full text-xs uppercase tracking-widest backdrop-blur-md transition pointer-events-auto border border-white/30 shadow-lg">
                Play Again
            </button>
            <!-- Add this at the very bottom of your 1st code, right before </body> -->
            <div style="text-align: center; margin-top: 30px;">
                 <a href="page2.html" style="background-color: #ec647d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-family: Arial, sans-serif; font-weight: bold; display: inline-block;">Next &rarr;</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Application states: 'IDLE', 'PULLING', 'FLYING', 'TRANSITIONING', 'CELEBRATING'
        let appState = 'IDLE';

        // Bow position (fixed on the left side)
        let bow = {
            x: width * 0.18,
            y: height * 0.65,
            radius: 70
        };

        // Arrow current state
        let arrow = {
            x: bow.x,
            y: bow.y,
            angle: 0,
            length: 80,
            vx: 0,
            vy: 0,
            active: false
        };

        // Pull interaction state
        let isDragging = false;
        let dragX = bow.x;
        let dragY = bow.y;
        let maxPullDistance = 120;

        // Target heart position (center-right)
        let targetHeart = {
            x: width * 0.62,
            y: height * 0.35,
            size: 90,
            pulse: 0
        };

        // Floating ambient particles & small background hearts
        let ambientParticles = [];
        for(let i=0; i<25; i++) {
            ambientParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 6 + 4,
                speedY: -Math.random() * 0.5 - 0.2,
                opacity: Math.random() * 0.5 + 0.2,
                color: Math.random() > 0.5 ? '#f43f5e' : '#fb7185'
            });
        }

        // Flying hearts emitted upon impact
        let burstHearts = [];

        function drawHeart(x, y, size, color, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            let d = size / 2;
            ctx.moveTo(x, y + d * 0.3);
            ctx.bezierCurveTo(x, y - d * 0.5, x - size, y - d * 0.5, x - size, y + d * 0.3);
            ctx.bezierCurveTo(x - size, y + d * 1.1, x - d * 0.5, y + d * 1.4, x, y + d * 1.8);
            ctx.bezierCurveTo(x + d * 0.5, y + d * 1.4, x + size, y + d * 1.1, x + size, y + d * 0.3);
            ctx.bezierCurveTo(x + size, y - d * 0.5, x, y - d * 0.5, x, y + d * 0.3);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function getPointerPos(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX, y: clientY };
        }

        window.addEventListener('mousedown', onPointerStart);
        window.addEventListener('touchstart', onPointerStart);

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('touchmove', onPointerMove);

        window.addEventListener('mouseup', onPointerEnd);
        window.addEventListener('touchend', onPointerEnd);

        function onPointerStart(e) {
            if (appState !== 'IDLE') return;
            const pos = getPointerPos(e);
            
            // Check if click is near the bow area
            const dist = Math.hypot(pos.x - bow.x, pos.y - bow.y);
            if (dist < 120 || true) { // allow anywhere pull for easy mobile UX
                isDragging = true;
                dragX = pos.x;
                dragY = pos.y;
                appState = 'PULLING';
                document.getElementById('uiOverlay').style.opacity = '0.5';
            }
        }

        function onPointerMove(e) {
            if (!isDragging || appState !== 'PULLING') return;
            const pos = getPointerPos(e);
            
            // Restrict pull backward (to the left/down-left)
            let dx = pos.x - bow.x;
            let dy = pos.y - bow.y;
            let dist = Math.hypot(dx, dy);

            if (dist > maxPullDistance) {
                dx = (dx / dist) * maxPullDistance;
                dy = (dy / dist) * maxPullDistance;
            }

            // Only allow pulling backward (dx < 0 or general pull)
            dragX = bow.x + dx;
            dragY = bow.y + dy;
        }

        function onPointerEnd(e) {
            if (!isDragging || appState !== 'PULLING') return;
            isDragging = false;

            // Calculate pull vector to launch arrow
            let pullVectorX = bow.x - dragX;
            let pullVectorY = bow.y - dragY;
            let pullDist = Math.hypot(pullVectorX, pullVectorY);

            if (pullDist > 15) {
                // Launch arrow!
                appState = 'FLYING';
                arrow.x = dragX;
                arrow.y = dragY;
                
                const power = 0.28;
                arrow.vx = pullVectorX * power;
                arrow.vy = pullVectorY * power;
                arrow.angle = Math.atan2(arrow.vy, arrow.vx);
            } else {
                appState = 'IDLE';
                document.getElementById('uiOverlay').style.opacity = '1';
            }
        }

        let animationId;
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Update responsive layout coordinates if resized
            targetHeart.x = width > 768 ? width * 0.65 : width * 0.5;
            targetHeart.y = height * 0.38;
            bow.x = width > 768 ? width * 0.22 : width * 0.2;
            bow.y = height * 0.62;

            // Render ambient floating background particles
            ambientParticles.forEach(p => {
                p.y += p.speedY;
                if (p.y < -10) p.y = height + 10;
                drawHeart(p.x, p.y, p.size, p.color, p.opacity);
            });

            // Draw target pulsating pink heart
            targetHeart.pulse += 0.04;
            let currentHeartSize = targetHeart.size + Math.sin(targetHeart.pulse) * 6;
            
            // Heart glow effect
            ctx.save();
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 25;
            drawHeart(targetHeart.x, targetHeart.y, currentHeartSize, '#fb7185', 0.9);
            drawHeart(targetHeart.x - 5, targetHeart.y - 5, currentHeartSize * 0.8, '#fda4af', 0.6);
            ctx.restore();

            // Draw Bow & Arrow mechanics
            if (appState === 'IDLE' || appState === 'PULLING') {
                let stringX = bow.x;
                let stringY = bow.y;
                let arrX = bow.x;
                let arrY = bow.y;
                let angle = -Math.PI / 4;

                if (appState === 'PULLING') {
                    stringX = dragX;
                    stringY = dragY;
                    arrX = dragX;
                    arrY = dragY;
                    let dx = bow.x - dragX;
                    let dy = bow.y - dragY;
                    angle = Math.atan2(dy, dx);
                }

                // Draw Bow string (elastic band effect)
                ctx.strokeStyle = '#881337';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                // Top bow tip
                let topTipX = bow.x - 15;
                let topTipY = bow.y - 75;
                // Bottom bow tip
                let botTipX = bow.x - 15;
                let botTipY = bow.y + 75;

                ctx.moveTo(topTipX, topTipY);
                ctx.lineTo(stringX, stringY);
                ctx.lineTo(botTipX, botTipY);
                ctx.stroke();

                // Draw Bow wood arc
                ctx.beginPath();
                ctx.strokeStyle = '#9f1239';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.arc(bow.x - 25, bow.y, 80, -Math.PI * 0.42, Math.PI * 0.42);
                ctx.stroke();

                // Draw Arrow
                ctx.save();
                ctx.translate(arrX, arrY);
                ctx.rotate(angle);

                // Arrow shaft
                ctx.fillStyle = '#475569';
                ctx.fillRect(-80, -2, 90, 4);

                // Arrow head
                ctx.fillStyle = '#e2e8f0';
                ctx.beginPath();
                ctx.moveTo(10, -6);
                ctx.lineTo(22, 0);
                ctx.lineTo(10, 6);
                ctx.closePath();
                ctx.fill();

                // Fletching / feathers
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.moveTo(-80, 0);
                ctx.lineTo(-95, -8);
                ctx.lineTo(-85, 0);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            // Arrow flight physics
            if (appState === 'FLYING') {
                arrow.x += arrow.vx;
                arrow.y += arrow.vy;
                arrow.vy += 0.15; // mild gravity arc

                // Draw flying arrow
                ctx.save();
                ctx.translate(arrow.x, arrow.y);
                ctx.rotate(arrow.angle);
                ctx.fillStyle = '#475569';
                ctx.fillRect(-40, -2, 60, 4);
                ctx.fillStyle = '#e2e8f0';
                ctx.beginPath();
                ctx.moveTo(20, -5);
                ctx.lineTo(30, 0);
                ctx.lineTo(20, 5);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                // Check collision with heart target
                let hitDist = Math.hypot(arrow.x - targetHeart.x, arrow.y - targetHeart.y);
                if (hitDist < currentHeartSize * 0.8 || arrow.y > height + 50 || arrow.x > width + 50) {
                    triggerTransition();
                }
            }

            // Render active burst hearts upon arrow hit or scene progression
            for (let i = burstHearts.length - 1; i >= 0; i--) {
                let bh = burstHearts[i];
                bh.x += bh.vx;
                bh.y += bh.vy;
                bh.alpha -= 0.02;
                drawHeart(bh.x, bh.y, bh.size, bh.color, Math.max(0, bh.alpha));
                if (bh.alpha <= 0) burstHearts.splice(i, 1);
            }

            animationId = requestAnimationFrame(animate);
        }

        let treeProgress = 0;
        let treeAnimating = false;

        function triggerTransition() {
            appState = 'TRANSITIONING';
            
            // Create burst heart particles at target
            for(let i=0; i<18; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                burstHearts.push({
                    x: targetHeart.x,
                    y: targetHeart.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 20 + 10,
                    color: Math.random() > 0.5 ? '#ffffff' : '#fecdd3',
                    alpha: 1
                });
            }

            // Fade in magenta scene overlay
            const scene = document.getElementById('birthdayScene');
            scene.classList.remove('opacity-0', 'pointer-events-none');
            scene.classList.add('opacity-100');

            // Hide instruction UI
            document.getElementById('uiOverlay').style.opacity = '0';

            // Step sequence in transition
            setTimeout(() => {
                const wishStep = document.getElementById('wishStep');
                wishStep.style.opacity = '0';
                setTimeout(() => {
                    wishStep.style.display = 'none';
                    const finalStep = document.getElementById('finalGreetingStep');
                    finalStep.style.opacity = '1';
                    
                    // Start blooming tree animation
                    startBloomingTree();
                }, 700);
            }, 1800);
        }

        function startBloomingTree() {
            treeAnimating = true;
            treeProgress = 0;
            requestAnimationFrame(animateTree);
        }

        function animateTree() {
            if (!treeAnimating) return;
            const treeCanvas = document.getElementById('treeCanvas');
            const tCtx = treeCanvas.getContext('2d');
            const tw = treeCanvas.width = treeCanvas.offsetWidth * window.devicePixelRatio;
            const th = treeCanvas.height = treeCanvas.offsetHeight * window.devicePixelRatio;
            
            tCtx.clearRect(0, 0, tw, th);
            tCtx.save();
            tCtx.scale(window.devicePixelRatio, window.devicePixelRatio);

            const startX = treeCanvas.offsetWidth / 2;
            const startY = treeCanvas.offsetHeight - 20;

            treeProgress = Math.min(1, treeProgress + 0.02);

            // Draw trunk
            tCtx.strokeStyle = '#fda4af';
            tCtx.lineWidth = 8;
            tCtx.lineCap = 'round';
            tCtx.beginPath();
            tCtx.moveTo(startX, startY);
            let trunkTopY = startY - 110 * treeProgress;
            tCtx.lineTo(startX, trunkTopY);
            tCtx.stroke();

            // Draw branches forming heart shape if treeProgress is substantial
            if (treeProgress > 0.3) {
                let branchProgress = (treeProgress - 0.3) / 0.7;
                
                tCtx.lineWidth = 4;
                // Left main branch arc
                tCtx.beginPath();
                tCtx.moveTo(startX, trunkTopY + 30);
                tCtx.quadraticCurveTo(startX - 50 * branchProgress, trunkTopY - 20 * branchProgress, startX - 80 * branchProgress, trunkTopY - 70 * branchProgress);
                tCtx.stroke();

                // Right main branch arc
                tCtx.beginPath();
                tCtx.moveTo(startX, trunkTopY + 30);
                tCtx.quadraticCurveTo(startX + 50 * branchProgress, trunkTopY - 20 * branchProgress, startX + 80 * branchProgress, trunkTopY - 70 * branchProgress);
                tCtx.stroke();

                // Blossoming hearts on branches
                if (branchProgress > 0.6) {
                    let heartAlpha = (branchProgress - 0.6) / 0.4;
                    // Draw cluster of cute pink hearts shaping the tree crown
                    const heartPositions = [
                        {x: startX - 70, y: trunkTopY - 80, size: 28},
                        {x: startX + 70, y: trunkTopY - 80, size: 28},
                        {x: startX - 40, y: trunkTopY - 110, size: 32},
                        {x: startX + 40, y: trunkTopY - 110, size: 32},
                        {x: startX, y: trunkTopY - 130, size: 36},
                        {x: startX - 90, y: trunkTopY - 40, size: 22},
                        {x: startX + 90, y: trunkTopY - 40, size: 22},
                    ];

                    heartPositions.forEach(hp => {
                        drawTreeHeart(tCtx, hp.x, hp.y, hp.size * heartAlpha, '#fff1f2');
                    });
                }
            }

            tCtx.restore();

            if (treeProgress < 1) {
                requestAnimationFrame(animateTree);
            }
        }

        function drawTreeHeart(tCtx, x, y, size, color) {
            tCtx.save();
            tCtx.fillStyle = color;
            tCtx.beginPath();
            let d = size / 2;
            tCtx.moveTo(x, y + d * 0.3);
            tCtx.bezierCurveTo(x, y - d * 0.5, x - size, y - d * 0.5, x - size, y + d * 0.3);
            tCtx.bezierCurveTo(x - size, y + d * 1.1, x - d * 0.5, y + d * 1.4, x, y + d * 1.8);
            tCtx.bezierCurveTo(x + d * 0.5, y + d * 1.4, x + size, y + d * 1.1, x + size, y + d * 0.3);
            tCtx.bezierCurveTo(x + size, y - d * 0.5, x, y - d * 0.5, x, y + d * 0.3);
            tCtx.closePath();
            tCtx.fill();
            tCtx.restore();
        }

        function resetExperience() {
            treeAnimating = false;
            const scene = document.getElementById('birthdayScene');
            scene.classList.remove('opacity-100');
            scene.classList.add('opacity-0', 'pointer-events-none');

            document.getElementById('wishStep').style.display = 'flex';
            document.getElementById('wishStep').style.opacity = '1';
            document.getElementById('finalGreetingStep').style.opacity = '0';
            document.getElementById('uiOverlay').style.opacity = '1';

            appState = 'IDLE';
            arrow.x = bow.x;
            arrow.y = bow.y;
        }

        // Start main loop on load
        window.onload = function() {
            animate();
        };
    </script>
    
</body>
</html>
